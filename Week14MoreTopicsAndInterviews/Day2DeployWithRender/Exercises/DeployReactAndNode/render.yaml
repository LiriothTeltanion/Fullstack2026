# Render Blueprint: one Node web service for the API and one static site for React.
# In the Render dashboard: New > Blueprint, pick the repository and set the
# Blueprint path to this file. rootDir is relative to the repository root.
services:
  - type: web
    name: deploy-tips-api
    runtime: node
    plan: free
    rootDir: Week14MoreTopicsAndInterviews/Day2DeployWithRender/Exercises/DeployReactAndNode/server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render asks for this value when the Blueprint is created
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: deploy-tips-client
    runtime: static
    rootDir: Week14MoreTopicsAndInterviews/Day2DeployWithRender/Exercises/DeployReactAndNode/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # The API's public URL, used at build time by Vite
      - key: VITE_API_URL
        sync: false
    routes:
      # Send every path to index.html so a page refresh never 404s
      - type: rewrite
        source: /*
        destination: /index.html
