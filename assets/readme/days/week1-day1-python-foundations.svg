<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Week 1 Day 1 Python foundations evidence map</title>
  <desc id="desc">Exercises XP 1 through 9, Gold 1 through 2, and Ninja 1 through 5 are repository-verified by twenty-three focused tests. The Daily Challenge matches the reviewed official prompt and passes five focused tests. Learning and Octopus submission remain unverified.</desc>
  <defs>
    <linearGradient id="day1-background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#030712"/>
      <stop offset="0.52" stop-color="#0a1738"/>
      <stop offset="1" stop-color="#071d2b"/>
    </linearGradient>
    <linearGradient id="day1-trace" x1="0" x2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="day1-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#60a5fa" stroke-opacity="0.07"/>
    </pattern>
    <filter id="day1-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="day1-signal-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="signal-blur"/>
      <feMerge><feMergeNode in="signal-blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .eyebrow { font: 700 18px "Segoe UI", Arial, sans-serif; letter-spacing: 3px; fill: #7dd3fc; }
      .hero { font: 900 48px "Segoe UI", Arial, sans-serif; letter-spacing: 2px; fill: #f8fafc; }
      .signature { font: 700 18px "Segoe UI", Arial, sans-serif; letter-spacing: 1px; fill: #94a3b8; }
      .concept { font: 800 18px "Segoe UI", Arial, sans-serif; letter-spacing: 1px; fill: #e0f2fe; }
      .card-kicker { font: 800 18px "Segoe UI", Arial, sans-serif; letter-spacing: 2px; fill: #bae6fd; }
      .card-title { font: 900 25px "Segoe UI", Arial, sans-serif; fill: #f8fafc; }
      .card-note { font: 650 18px "Segoe UI", Arial, sans-serif; fill: #cbd5e1; }
      .card-micro { font: 800 14px "Segoe UI", Arial, sans-serif; letter-spacing: 0.4px; }
      .verified { fill: #34d399; }
      .pending { fill: #fbbf24; }
      .truth { font: 800 18px "Segoe UI", Arial, sans-serif; letter-spacing: 0.7px; fill: #ddd6fe; }
      .motion-layer { pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion-layer { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#day1-background)"/>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="url(#day1-grid)" stroke="#25345f" stroke-width="2"/>

  <g aria-label="Week 1 Day 1 heading">
    <text x="64" y="49" class="eyebrow">WEEK 1 · DAY 1 · EVIDENCE CHECKPOINT</text>
    <text x="64" y="101" class="hero">PYTHON FOUNDATIONS</text>
    <text x="1136" y="49" text-anchor="end" class="signature">KEVIN CUSNIR · LIRIOTH TELTANION</text>
  </g>

  <g aria-label="Concept path from printing through conditions">
    <path d="M86 158H1114" stroke="#1e2d52" stroke-width="8" stroke-linecap="round"/>
    <path d="M86 158H1114" stroke="url(#day1-trace)" stroke-width="3" stroke-linecap="round" opacity="0.42"/>
    <g class="motion-layer" aria-hidden="true">
      <path d="M86 158H1114" fill="none" stroke="url(#day1-trace)" stroke-width="4" stroke-linecap="round" stroke-dasharray="22 34" filter="url(#day1-glow)">
        <animate attributeName="stroke-dashoffset" values="0;-336" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0.95;0.95;0.35" keyTimes="0;0.06;0.62;1" dur="12s" repeatCount="indefinite"/>
      </path>

      <g filter="url(#day1-signal-glow)">
        <circle r="8" fill="#f8fafc">
          <animateMotion path="M86 158H1114" keyPoints="0;1;1" keyTimes="0;0.62;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.025;0.59;0.64;1" dur="12s" repeatCount="indefinite"/>
        </circle>
        <circle r="16" fill="none" stroke="#7dd3fc" stroke-width="2">
          <animateMotion path="M86 158H1114" keyPoints="0;1;1" keyTimes="0;0.62;1" calcMode="linear" dur="12s" repeatCount="indefinite"/>
          <animate attributeName="r" values="11;18;11" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.58;0.58;0;0" keyTimes="0;0.025;0.59;0.64;1" dur="12s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g fill="none" stroke="#e0f2fe" stroke-width="3" filter="url(#day1-glow)">
        <circle cx="112" cy="158" r="18" opacity="0">
          <animate attributeName="r" values="15;15;27;15;15" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="0.15s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="0.15s" repeatCount="indefinite"/>
        </circle>
        <circle cx="306" cy="158" r="18" opacity="0">
          <animate attributeName="r" values="15;15;27;15;15" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="1.32s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="1.32s" repeatCount="indefinite"/>
        </circle>
        <circle cx="500" cy="158" r="18" opacity="0">
          <animate attributeName="r" values="15;15;27;15;15" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="2.49s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="2.49s" repeatCount="indefinite"/>
        </circle>
        <circle cx="694" cy="158" r="18" opacity="0">
          <animate attributeName="r" values="15;15;27;15;15" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="3.66s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="3.66s" repeatCount="indefinite"/>
        </circle>
        <circle cx="888" cy="158" r="18" opacity="0">
          <animate attributeName="r" values="15;15;27;15;15" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="4.83s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="4.83s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1082" cy="158" r="18" opacity="0">
          <animate attributeName="r" values="15;15;27;15;15" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.01;0.06;0.12;1" dur="12s" begin="6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <g transform="translate(112 158)"><circle r="13" fill="#38bdf8"/><text y="-24" text-anchor="middle" class="concept">PRINT</text></g>
    <g transform="translate(306 158)"><circle r="13" fill="#38bdf8"/><text y="-24" text-anchor="middle" class="concept">VARIABLES</text></g>
    <g transform="translate(500 158)"><circle r="13" fill="#38bdf8"/><text y="-24" text-anchor="middle" class="concept">MATH</text></g>
    <g transform="translate(694 158)"><circle r="13" fill="#818cf8"/><text y="-24" text-anchor="middle" class="concept">COMPARE</text></g>
    <g transform="translate(888 158)"><circle r="13" fill="#22d3ee"/><text y="-24" text-anchor="middle" class="concept">INPUT</text></g>
    <g transform="translate(1082 158)"><circle r="13" fill="#22d3ee"/><text y="-24" text-anchor="middle" class="concept">IF</text></g>
  </g>

  <g aria-label="Exercises XP repository verification">
    <rect x="64" y="205" width="318" height="152" rx="22" fill="#071127" stroke="#34d399" stroke-width="2"/>
    <circle cx="94" cy="236" r="8" class="verified"/>
    <text x="115" y="243" class="card-kicker">XP 1–9</text>
    <text x="92" y="286" class="card-title">REPOSITORY VERIFIED</text>
    <text x="92" y="321" class="card-note">10 focused tests passing</text>
    <path d="M326 238l10 10 21-25" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g aria-label="XP Gold repository verification">
    <rect x="398" y="205" width="318" height="152" rx="22" fill="#0c1329" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="428" cy="236" r="8" class="verified"/>
    <text x="449" y="243" class="card-kicker">GOLD 1–2</text>
    <text x="426" y="282" class="card-title">REPOSITORY VERIFIED</text>
    <text x="426" y="321" class="card-note">6 tests · repeat + seasons</text>
    <path d="M659 238l10 10 21-25" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g aria-label="XP Ninja repository verification">
    <rect x="732" y="205" width="194" height="152" rx="22" fill="#071127" stroke="#34d399" stroke-width="2"/>
    <text x="756" y="241" class="card-kicker">XP NINJA</text>
    <text x="756" y="282" class="card-title">VERIFIED</text>
    <text x="756" y="316" class="card-note">7 focused tests</text>
    <path d="M884 238l8 8 16-19" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g aria-label="Daily Challenge official prompt aligned and repository-verified">
    <rect x="942" y="205" width="194" height="152" rx="22" fill="#0c1329" stroke="#34d399" stroke-width="2"/>
    <text x="966" y="241" class="card-kicker">DAILY</text>
    <text x="966" y="278" class="card-title">PROMPT</text>
    <text x="966" y="307" class="card-title">ALIGNED</text>
    <text x="966" y="338" class="card-micro verified">5 TESTS · VERIFIED</text>
  </g>

  <g class="motion-layer" aria-hidden="true" fill="none" filter="url(#day1-glow)">
    <rect x="64" y="205" width="318" height="152" rx="22" stroke="#6ee7b7" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.62;0.66;0.70;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="398" y="205" width="318" height="152" rx="22" stroke="#fde68a" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.70;0.74;0.78;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="732" y="205" width="194" height="152" rx="22" stroke="#6ee7b7" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.78;0.82;0.86;1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="942" y="205" width="194" height="152" rx="22" stroke="#6ee7b7" stroke-width="5" stroke-dasharray="14 10" opacity="0">
      <animate attributeName="stroke-dashoffset" values="0;-192" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.95;0.35;0" keyTimes="0;0.86;0.90;0.95;1" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g aria-label="Truth boundary">
    <rect x="64" y="382" width="252" height="38" rx="19" fill="#161533" stroke="#a78bfa"/>
    <text x="190" y="407" text-anchor="middle" class="truth">LEARNING · UNVERIFIED</text>
    <rect x="332" y="382" width="334" height="38" rx="19" fill="#161533" stroke="#a78bfa"/>
    <text x="499" y="407" text-anchor="middle" class="truth">OCTOPUS SUBMISSION · UNVERIFIED</text>
    <text x="1136" y="407" text-anchor="end" class="card-note">NEXT · Kevin explains, then submits manually</text>
    <g class="motion-layer" aria-hidden="true" fill="none" stroke="#67e8f9" stroke-linecap="round" stroke-linejoin="round" filter="url(#day1-glow)">
      <path d="M704 385H1116" stroke-width="2" stroke-dasharray="5 18" opacity="0">
        <animate attributeName="stroke-dashoffset" values="0;-138" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;0.85;0" keyTimes="0;0.89;0.94;1" dur="12s" repeatCount="indefinite"/>
      </path>
      <path d="M1098 379l10 6-10 6M1110 379l10 6-10 6" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.90;0.94;0.985;1" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
