<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Fullstack2026 source-backed technology constellation</title>
  <desc id="description">A static constellation connecting Python, object-oriented programming, HTML and CSS, JavaScript, TypeScript, SQL, Node.js, and quality engineering. The nodes represent technologies found in repository source files, not claims of mastery.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#18245c"/>
      <stop offset="0.58" stop-color="#090f29"/>
      <stop offset="1" stop-color="#050817"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#132252"/>
      <stop offset="1" stop-color="#090f29"/>
    </linearGradient>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .eyebrow { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #a5f3fc; letter-spacing: 2.2px; }
      .heading { font: 900 26px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; letter-spacing: 0.5px; }
      .node-label { font: 800 12px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .node-note { font: 600 10px 'Segoe UI', Arial, sans-serif; fill: #cbd5e1; letter-spacing: 0.5px; }
      .footer { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; letter-spacing: 0.7px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="28" fill="url(#background)" stroke="#33436f" stroke-width="2"/>
  <path d="M86 58H278" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <text x="86" y="88" class="eyebrow">SOURCE-BACKED TECHNOLOGY MAP</text>
  <text x="86" y="121" class="heading">A curriculum constellation, not a mastery score</text>

  <g fill="none" stroke-width="2" stroke-dasharray="7 10" opacity="0.62">
    <line x1="600" y1="206" x2="142" y2="184" stroke="#38bdf8"/>
    <line x1="600" y1="206" x2="142" y2="286" stroke="#a78bfa"/>
    <line x1="600" y1="206" x2="370" y2="151" stroke="#f472b6"/>
    <line x1="600" y1="206" x2="370" y2="284" stroke="#f59e0b"/>
    <line x1="600" y1="206" x2="830" y2="151" stroke="#22c55e"/>
    <line x1="600" y1="206" x2="830" y2="284" stroke="#06b6d4"/>
    <line x1="600" y1="206" x2="1058" y2="184" stroke="#86efac"/>
    <line x1="600" y1="206" x2="1058" y2="286" stroke="#c4b5fd"/>
  </g>

  <g filter="url(#soft-glow)">
    <circle cx="600" cy="206" r="78" fill="url(#core)" stroke="#67e8f9" stroke-width="4"/>
    <circle cx="600" cy="206" r="61" fill="none" stroke="#c4b5fd" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="9 12"/>
  </g>
  <text x="600" y="201" text-anchor="middle" class="heading">FULL-STACK</text>
  <text x="600" y="226" text-anchor="middle" class="eyebrow">ENGINEERING</text>
  <text x="600" y="249" text-anchor="middle" class="node-note">REPOSITORY EVIDENCE</text>

  <g transform="translate(142 184)">
    <circle r="42" fill="#0b1330" stroke="#38bdf8" stroke-width="3"/>
    <text y="4" text-anchor="middle" class="node-label">PYTHON</text>
    <text y="20" text-anchor="middle" class="node-note">W1–W2</text>
  </g>
  <g transform="translate(142 286)">
    <circle r="42" fill="#0b1330" stroke="#a78bfa" stroke-width="3"/>
    <text y="4" text-anchor="middle" class="node-label">OOP</text>
    <text y="20" text-anchor="middle" class="node-note">W2</text>
  </g>
  <g transform="translate(370 151)">
    <circle r="42" fill="#0b1330" stroke="#f472b6" stroke-width="3"/>
    <text y="4" text-anchor="middle" class="node-label">HTML + CSS</text>
    <text y="20" text-anchor="middle" class="node-note">W3–W5</text>
  </g>
  <g transform="translate(370 284)">
    <circle r="42" fill="#0b1330" stroke="#f59e0b" stroke-width="3"/>
    <text y="4" text-anchor="middle" class="node-label">JAVASCRIPT</text>
    <text y="20" text-anchor="middle" class="node-note">W3–W6</text>
  </g>
  <g transform="translate(830 151)">
    <circle r="42" fill="#0b1330" stroke="#22c55e" stroke-width="3"/>
    <text y="4" text-anchor="middle" class="node-label">TYPESCRIPT</text>
    <text y="20" text-anchor="middle" class="node-note">W5</text>
  </g>
  <g transform="translate(830 284)">
    <circle r="42" fill="#0b1330" stroke="#06b6d4" stroke-width="3"/>
    <text y="4" text-anchor="middle" class="node-label">SQL</text>
    <text y="20" text-anchor="middle" class="node-note">W6</text>
  </g>
  <g transform="translate(1058 184)">
    <circle r="42" fill="#0b1330" stroke="#86efac" stroke-width="3"/>
    <text y="4" text-anchor="middle" class="node-label">NODE.JS</text>
    <text y="20" text-anchor="middle" class="node-note">W6</text>
  </g>
  <g transform="translate(1058 286)">
    <circle r="42" fill="#0b1330" stroke="#c4b5fd" stroke-width="3"/>
    <text y="4" text-anchor="middle" class="node-label">QUALITY</text>
    <text y="20" text-anchor="middle" class="node-note">CI + TESTS</text>
  </g>

  <text x="600" y="338" text-anchor="middle" class="footer">STATIC BY DESIGN · ACCESSIBLE MOTION BOUNDARY · SOURCE PRESENCE ≠ LEARNING MASTERY</text>
</svg>
