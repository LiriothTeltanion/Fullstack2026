# Static site: the exercise showcase (index.html) plus the browser exercises.
# No build step; Netlify publishes the repository root as it is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
