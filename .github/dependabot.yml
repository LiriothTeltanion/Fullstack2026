version: 2

# Same policy as NovaMusicLab and IvritSheli: minor and patch bumps arrive
# grouped in one PR, and major bumps arrive one by one, because they are the
# only ones that can break the build.
#
# Cooldown since 2026-09-14: a freshly published version waits before it is
# proposed, and a major waits a month. Security alerts do not follow this
# schedule. Minor and patch updates merge on their own once the checks pass
# (.github/workflows/dependabot-auto-merge.yml); majors wait for Kevin.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "06:40"
      timezone: Asia/Jerusalem
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:50"
      timezone: Asia/Jerusalem
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns: ["*"]
