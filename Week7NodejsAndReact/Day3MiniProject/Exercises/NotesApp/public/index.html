<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>My Notes</h1>

      <form id="note-form">
        <input type="hidden" id="note-id" />
        <label for="title">Title</label>
        <input id="title" required maxlength="80" />
        <label for="body">Note</label>
        <textarea id="body" rows="4"></textarea>
        <div class="row">
          <button type="submit" id="save">Add note</button>
          <button type="button" id="cancel" hidden>Cancel edit</button>
        </div>
      </form>

      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Filter by word" />

      <p id="message" aria-live="polite"></p>
      <ul id="notes"></ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
