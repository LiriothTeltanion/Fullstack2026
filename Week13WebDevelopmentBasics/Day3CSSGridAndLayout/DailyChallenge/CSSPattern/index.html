<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Pattern</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main
      class="pattern"
      aria-label="Twelve yellow squares with black borders: four vertically on each side and four horizontally in the middle"
    >
      <section class="column" aria-label="Left column">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </section>
      <section class="middle" aria-label="Middle row">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </section>
      <section class="column" aria-label="Right column">
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
      </section>
    </main>
  </body>
</html>
