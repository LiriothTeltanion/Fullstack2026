<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eight CSS transitions</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <main class="transition-page">
      <h1>Eight CSS transitions</h1>
      <p>Hover a tile or focus it with the keyboard. Each transition is short and repeatable.</p>
      <div class="transition-grid">
        <button class="demo fade">Fade</button><button class="demo change-color">Color</button
        ><button class="demo resize">Grow and shrink</button
        ><button class="demo rotate-tile">Rotate</button
        ><button class="demo circle">Square to circle</button
        ><button class="demo shadow-3d">3D shadow</button><button class="demo swing">Swing</button
        ><button class="demo inset">Inset border</button>
      </div>
      <p><a href="extras.html">Extra orbit and CSS loader animations</a></p>
    </main>
  </body>
</html>
