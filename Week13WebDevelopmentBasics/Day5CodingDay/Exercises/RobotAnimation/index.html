<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Robot Animation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Robot Animation</h1>
      <p>Hover over the robot or focus it with the Tab key to make it move.</p>
      <div
        class="robot"
        role="img"
        aria-label="A friendly green robot waving and dancing"
        tabindex="0"
      >
        <div class="head">
          <span class="eye left-eye"></span><span class="eye right-eye"></span>
        </div>
        <div class="upper-body">
          <div class="arm left-arm"></div>
          <div class="torso"></div>
          <div class="arm right-arm"></div>
        </div>
        <div class="lower-body">
          <div class="leg left-leg"></div>
          <div class="leg right-leg"></div>
        </div>
      </div>
      <p class="note">Reduced-motion settings keep the robot still.</p>
    </main>
  </body>
</html>
